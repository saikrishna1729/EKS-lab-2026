# Layer-4 NLB, IP targets, straight to the pods. loadBalancerClass hands it to the AWS LB Controller
# (without it, the legacy in-tree provider would create a Classic LB like in L100).
apiVersion: v1
kind: Service
metadata:
  name: shop-api-nlb
  namespace: shop
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  selector:
    app.kubernetes.io/name: shop-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
