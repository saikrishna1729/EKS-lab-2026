# External Secrets Operator syncs eks-lab/<cluster>/shop from AWS Secrets Manager into a
# Kubernetes Secret. The ClusterSecretStore "aws-secrets-manager" is created by the
# platform (gitops/platform/config/external-secrets-store.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-secrets
  namespace: shop
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: shop-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: eks-lab/CLUSTER_NAME/shop
