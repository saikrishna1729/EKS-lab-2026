{{- if and .Values.certManager.enabled .Values.certManager.domain }}
# Let's Encrypt via Route 53 DNS-01. Start with staging (no rate limits), then prod.
{{- range $name, $server := dict "letsencrypt-staging" "https://acme-staging-v02.api.letsencrypt.org/directory" "letsencrypt-prod" "https://acme-v02.api.letsencrypt.org/directory" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: {{ $server }}
    email: {{ $.Values.certManager.email }}
    privateKeySecretRef:
      name: {{ $name }}-account
    solvers:
      - dns01:
          route53:
            region: {{ $.Values.region }}
            hostedZoneID: {{ $.Values.certManager.hostedZoneId }}
        selector:
          dnsZones: [{{ $.Values.certManager.domain | quote }}]
{{- end }}
{{- end }}
