# Installs tempo 3.2.1 on every cluster whose Argo CD cluster secret has enable_tempo=true.
# Per-cluster values come from the secret's annotations (written by scripts/addons.sh from Terraform).
# Ordering between add-ons is handled by retries (e.g. Karpenter CRs wait for the Karpenter CRDs).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tempo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_tempo: "true"
  template:
    metadata:
      name: 'tempo-{{ .name }}'
    spec:
      project: default
      sources:
        - repoURL: https://grafana-community.github.io/helm-charts
          chart: tempo
          targetRevision: 3.2.1
          helm:
            releaseName: tempo
            valueFiles:
              - $values/k8s/platform/values/tempo.yaml
        - repoURL: '{{ index .metadata.annotations "gitops_repo" }}'
          targetRevision: '{{ index .metadata.annotations "gitops_revision" }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: monitoring
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
