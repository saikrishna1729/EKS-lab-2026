# Installs kyverno 3.10.0 on every cluster whose Argo CD cluster secret has enable_kyverno=true.
# Per-cluster values come from the secret's annotations (written by scripts/addons.sh from Terraform).
# Ordering between add-ons is handled by retries (e.g. Karpenter CRs wait for the Karpenter CRDs).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_kyverno: "true"
  template:
    metadata:
      name: 'kyverno-{{ .name }}'
    spec:
      project: default
      sources:
        - repoURL: https://kyverno.github.io/kyverno/
          chart: kyverno
          targetRevision: 3.10.0
          helm:
            releaseName: kyverno
            valueFiles:
              - $values/k8s/platform/values/kyverno.yaml
        - repoURL: '{{ index .metadata.annotations "gitops_repo" }}'
          targetRevision: '{{ index .metadata.annotations "gitops_revision" }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: kyverno
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
