# Installs kube-prometheus-stack 93.3.0 on every cluster whose Argo CD cluster secret has enable_kube_prometheus_stack=true.
# Per-cluster values come from the secret's annotations (written by scripts/addons.sh from Terraform).
# Ordering between add-ons is handled by retries (e.g. Karpenter CRs wait for the Karpenter CRDs).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_kube_prometheus_stack: "true"
  template:
    metadata:
      name: 'kube-prometheus-stack-{{ .name }}'
    spec:
      project: default
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: 93.3.0
          helm:
            releaseName: kps
            valueFiles:
              - $values/k8s/platform/values/kube-prometheus-stack.yaml
        - repoURL: '{{ index .metadata.annotations "gitops_repo" }}'
          targetRevision: '{{ index .metadata.annotations "gitops_revision" }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: monitoring
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
