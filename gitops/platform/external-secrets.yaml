# Installs external-secrets 2.15.0 on every cluster whose Argo CD cluster secret has enable_external_secrets=true.
# Per-cluster values come from the secret's annotations (written by scripts/addons.sh from Terraform).
# Ordering between add-ons is handled by retries (e.g. Karpenter CRs wait for the Karpenter CRDs).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_external_secrets: "true"
  template:
    metadata:
      name: 'external-secrets-{{ .name }}'
    spec:
      project: default
      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 2.15.0
          helm:
            releaseName: external-secrets
            valueFiles:
              - $values/k8s/platform/values/external-secrets.yaml
        - repoURL: '{{ index .metadata.annotations "gitops_repo" }}'
          targetRevision: '{{ index .metadata.annotations "gitops_revision" }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: external-secrets
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
