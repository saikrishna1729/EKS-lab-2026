# Installs aws-load-balancer-controller 3.6.3 on every cluster whose Argo CD cluster secret has enable_lb_controller=true.
# Per-cluster values come from the secret's annotations (written by scripts/addons.sh from Terraform).
# Ordering between add-ons is handled by retries (e.g. Karpenter CRs wait for the Karpenter CRDs).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_lb_controller: "true"
  template:
    metadata:
      name: 'aws-load-balancer-controller-{{ .name }}'
    spec:
      project: default
      sources:
        - repoURL: https://aws.github.io/eks-charts
          chart: aws-load-balancer-controller
          targetRevision: 3.6.3
          helm:
            releaseName: aws-load-balancer-controller
            valueFiles:
              - $values/k8s/platform/values/aws-load-balancer-controller.yaml
            valuesObject:
              clusterName: '{{ index .metadata.annotations "cluster_name" }}'
              region: '{{ index .metadata.annotations "aws_region" }}'
              vpcId: '{{ index .metadata.annotations "aws_vpc_id" }}'
        - repoURL: '{{ index .metadata.annotations "gitops_repo" }}'
          targetRevision: '{{ index .metadata.annotations "gitops_revision" }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: kube-system
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
